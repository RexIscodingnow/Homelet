<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ESP32 Control Panel</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            body {
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                background-color: #f1f5f9; 
                {% if bg_image %}
                background-image: url("{{ url_for('uploaded_file', filename=bg_image) }}");
                {% endif %}
            }
        </style>
    </head>
    <body class="h-screen w-screen flex items-center justify-center m-0 transition-all duration-500">
        <div class="bg-white/50 backdrop-blur-md p-8 rounded-2xl shadow-2xl w-full max-w-md text-center border border-white/40">
            <h1 class="text-2xl font-bold text-slate-800 mb-2">Control Panel</h1>
            <p class="text-sm text-slate-600 mb-6">Send an action to remote a connected ESP32.</p>

            <div id="error-box" class="hidden mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded-xl text-sm font-medium">
                <p id="error-msg"></p>
            </div>

            {% if client_addr %}
                <p class="text-sm text-slate-600 mb-6">IP: {{ client_addr }}</p>
            {% else %}
                <p class="text-sm text-slate-600 mb-6">IP: </p>
            {% endif %}

            <form action="/control" method="POST" id="controlForm" class="flex flex-col gap-4">
                <button type="submit" id="conn_op" name="conn_op" value="connect" class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl transition duration-200 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    {% if esp32_connected %}
                        Disconnect ESP32
                    {% else %}
                        Connect ESP32
                    {% endif %}
                </button>

                <button type="submit" id="auto_sw" name="auto_sw" value="auto_switch" class="w-full py-3 px-4 bg-green-600 hover:bg-blue-700 text-white font-medium rounded-xl transition duration-200 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    Auto switch {% if auto_relay_on %}ON{% else %}OFF{% endif %}
                </button>

                <div class="w-full py-3 px-4 bg-slate-100/80 border border-slate-200 rounded-xl flex items-center justify-between shadow-sm">
                    <span class="text-slate-700 font-medium">Switch Control</span>

                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" name="light" id="lightToggle" value="1" class="sr-only peer" {% if relay_on %}checked{% endif %}>
                        <div class="w-14 h-7 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[4px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-amber-500"></div>
                        <span class="ml-3 text-sm font-semibold {% if relay_on %}text-amber-600{% else %}text-slate-500{% endif %}" id="lightText">
                            {% if relay_on %}ON{% else %}OFF{% endif %}
                        </span>
                    </label>
                </div>
            </form>

            <br>
            <br>

            <form action="/upload" method="POST" enctype="multipart/form-data" class="flex flex-col gap-4">
                <label class="w-full py-3 px-4 border-2 border-dashed border-indigo-300 hover:border-indigo-500 bg-indigo-50/50 hover:bg-indigo-50 text-indigo-700 font-medium rounded-xl cursor-pointer transition duration-200 flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    <span id="uploadText">Change Background</span>
                    <input type="file" name="background_image" id="imageInput" accept="image/*" class="hidden">
                </label>
            </form>

        </div>

        <script>
            const controlForm = document.getElementById('controlForm');
            const lightToggle = document.getElementById('lightToggle');
            const errorBox = document.getElementById('error-box');
            const errMsgText = document.getElementById('error-msg');
            const uploadText = document.getElementById('uploadText');
            const imageInput = document.getElementById('imageInput');

            lightToggle.addEventListener('change', async function() {
                try {
                    const response = await fetch('/control', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: 'light=1'
                    });

                    const result = await response.json();

                    if (result.status === "error") {
                        errMsgText.textContent = result.message;
                        errorBox.classList.remove('hidden');
                    } else {
                        errorBox.classList.add('hidden');
                        errorMsg.textContent = '';
                    }

                    if (!response.ok) {
                        console.error('Control command transmission failed');
                    }
                } catch (error) {
                    console.error('Network connection error:', error);
                }
            });

            imageInput.addEventListener('change', function(event) {
                const file = event.target.files[0];
                if (file) {
                    uploadText.textContent = `Uploading: ${file.name}...`;
                    imageInput.form.submit();
                }
            });
        </script>

    </body>
</html>
